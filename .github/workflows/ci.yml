name: CI

# Runs the same checks done by hand before every commit this session:
# frontend type-check and backend syntax-check. Railway and Vercel handle
# the actual deploy (CD) on push to main — this is the gate before that,
# catching a broken build on a PR instead of on the live site.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit -p .
        working-directory: frontend

  backend-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: node --check src/index.js && node --check src/lib/gemini.js && node --check src/lib/profound.js && node --check src/lib/supabase.js
        working-directory: backend
